<text x="100" y="270" font-family="monospace" font-size="19"><tspan fill="#eeeeee">  theme</tspan><tspan fill="#FF8A3C">.</tspan><tspan fill="#FF6A00">set</tspan><tspan fill="#FF8A3C">(</tspan><tspan fill="#FF6A00">"mimocode"</tspan><tspan fill="#FF8A3C">)</tspan></text>
<text x="100" y="306" font-family="monospace" font-size="19"><tspan fill="#818CF8">  if</tspan><tspan fill="#eeeeee"> sunset</tspan><tspan fill="#FF8A3C"> == </tspan><tspan fill="#FBBF24">true</tspan><tspan fill="#eeeeee"> {</tspan></text>
