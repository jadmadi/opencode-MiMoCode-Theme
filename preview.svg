<text x="100" y="414" font-family="monospace" font-size="19"><tspan fill="#eeeeee">}</tspan></text>
<text x="100" y="458" font-family="monospace" font-size="19"><tspan fill="#FF6A00">$</tspan><tspan fill="#eeeeee"> opencode run</tspan><tspan fill="#808080">  --theme mimocode</tspan><tspan fill="#FF6A00"> ▊</tspan></text>
